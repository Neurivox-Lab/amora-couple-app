server:
  port: 8080

spring:
  application:
    name: amora-couple-backend
  datasource:
    url: jdbc:h2:mem:amoradb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 2592000000 # 30 days
  gemini:
    api-key: ${GEMINI_API_KEY:}
  cors:
    allowed-origins: "*"
